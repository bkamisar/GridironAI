<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GridironAI — Trade Evaluator</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .team-picker-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .team-picker-row select { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; margin-bottom: 12px; }
    .roster-picker { max-height: 380px; overflow-y: auto; }
    .roster-picker label { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px; font-size: 0.86rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .roster-picker label:hover { background: #f8f8f8; }
    .roster-picker .pname { flex: 1; }
    .roster-picker .pmeta { color: #888; font-size: 0.8rem; white-space: nowrap; }
    .assume-note { font-size: 0.78rem; color: #888; margin: 4px 0 20px; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .side-card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .side-card h3 { margin: 0 0 10px; font-size: 1rem; }
    .side-row { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 5px 0; border-bottom: 1px solid #f5f5f5; }
    .side-row.total { font-weight: 700; border-bottom: none; padding-top: 8px; }
    .empty-side { color: #aaa; font-size: 0.85rem; }
    .metric-line { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 0.86rem; }
    .metric-line strong { display: block; margin-bottom: 2px; }
    .cap-illegal-badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; background: #fce8e6; color: #c62828; }
    .verdict { text-align: center; padding: 16px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; }
    .verdict-fair { background: #e6f4ea; color: #1e7e34; }
    .verdict-favors { background: #fff4e5; color: #a5641a; }
    .verdict-none { background: #f5f5f5; color: #888; }
  </style>
</head>
<body>
  <h1>Trade Evaluator</h1>
  <nav class="nav">
    <a href="index.html">Data Hub</a>
    <a href="bid.html">Bid Advisor</a>
    <a href="roster.html">Roster</a>
    <a href="trade.html" class="active">Trade Evaluator</a>
    <a href="contract.html">Contract Advisor</a>
  </nav>

  <div id="error"></div>
  <div id="content" style="display:none">
    <p class="assume-note">Assumes traded players keep their current salary/contract unchanged.</p>

    <div class="team-picker-row">
      <div>
        <select id="teamASelect"></select>
        <div class="roster-picker" id="rosterA"></div>
      </div>
      <div>
        <select id="teamBSelect"></select>
        <div class="roster-picker" id="rosterB"></div>
      </div>
    </div>

    <div id="verdict"></div>
    <div class="result-grid" id="resultGrid"></div>
  </div>

  <script src="leagues.js"></script>
  <script src="shared.js"></script>
  <script>
  (async function () {
    await autoLoadFromRepo();

    const errEl = document.getElementById('error');
    const content = document.getElementById('content');
    function showErr(msg, linkText, linkHref) {
      const d = document.createElement('div');
      d.className = 'error';
      d.textContent = msg + (linkText ? ' ' : '');
      if (linkText) {
        const a = document.createElement('a');
        a.href = linkHref;
        a.textContent = linkText;
        d.appendChild(a);
      }
      errEl.appendChild(d);
    }

    const LEAGUE = LEAGUES[0];
    const players = loadData('gridiron_players');
    const myTeam = loadData('gridiron_my_team') || '';
    if (!players) { showErr('Missing data — upload the CSV on the', 'Data Hub.', 'index.html'); return; }

    content.style.display = '';

    const valued = valuePlayers(players, LEAGUE);
    const dollars = computeDollarValues(valued, LEAGUE);
    function dollarOf(p) { return dollars[p.id] || 1; }

    const teams = Array.from(new Set(players.filter(p => !p.isFreeAgent).map(p => p.team))).sort();

    const teamASelect = document.getElementById('teamASelect');
    const teamBSelect = document.getElementById('teamBSelect');
    teams.forEach(t => {
      const optA = document.createElement('option');
      optA.value = t;
      optA.textContent = t; // textContent — never innerHTML — team names come from the CSV
      teamASelect.appendChild(optA);
      const optB = document.createElement('option');
      optB.value = t;
      optB.textContent = t;
      teamBSelect.appendChild(optB);
    });
    teamASelect.value = teams.indexOf(myTeam) !== -1 ? myTeam : teams[0];
    teamBSelect.value = teams.find(t => t !== teamASelect.value) || teams[0];

    const sentA = new Set(); // player ids Team A is sending
    const sentB = new Set(); // player ids Team B is sending

    function rosterOf(team) {
      return valued.players.filter(p => p.team === team).sort((a, b) => dollarOf(b) - dollarOf(a));
    }

    function buildPicker(container, team, sentSet, otherSentSet) {
      while (container.firstChild) container.removeChild(container.firstChild);
      sentSet.clear();
      rosterOf(team).forEach(p => {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.addEventListener('change', () => {
          if (cb.checked) sentSet.add(p.id); else sentSet.delete(p.id);
          renderResults();
        });
        const name = document.createElement('span');
        name.className = 'pname';
        name.textContent = p.name + ' (' + p.position + ')';
        const meta = document.createElement('span');
        meta.className = 'pmeta';
        meta.textContent = '$' + dollarOf(p) + ' val · $' + (p.salary != null ? p.salary : 0) + ' sal';
        label.appendChild(cb);
        label.appendChild(name);
        label.appendChild(meta);
        container.appendChild(label);
      });
      renderResults();
    }

    function sideCard(title, sendPlayers, receivePlayers) {
      const card = document.createElement('div');
      card.className = 'side-card';
      const h3 = document.createElement('h3');
      h3.textContent = title;
      card.appendChild(h3);

      function section(label, list) {
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:0.75rem;text-transform:uppercase;color:#999;margin:8px 0 4px';
        lbl.textContent = label;
        card.appendChild(lbl);
        if (!list.length) {
          const e = document.createElement('div');
          e.className = 'empty-side';
          e.textContent = 'Nothing selected';
          card.appendChild(e);
          return 0;
        }
        let total = 0;
        list.forEach(p => {
          const row = document.createElement('div');
          row.className = 'side-row';
          const n = document.createElement('span');
          n.textContent = p.name + ' (' + p.position + ')';
          const v = document.createElement('span');
          v.textContent = '$' + dollarOf(p);
          row.appendChild(n);
          row.appendChild(v);
          card.appendChild(row);
          total += dollarOf(p);
        });
        const totalRow = document.createElement('div');
        totalRow.className = 'side-row total';
        const tn = document.createElement('span');
        tn.textContent = 'Total';
        const tv = document.createElement('span');
        tv.textContent = '$' + total;
        totalRow.appendChild(tn);
        totalRow.appendChild(tv);
        card.appendChild(totalRow);
        return total;
      }

      const sentTotal = section('Sends', sendPlayers);
      const recvTotal = section('Receives', receivePlayers);
      return { card, sentTotal, recvTotal };
    }

    function metricLine(card, label, text, illegal) {
      const m = document.createElement('div');
      m.className = 'metric-line';
      const strong = document.createElement('strong');
      strong.textContent = label;
      m.appendChild(strong);
      m.appendChild(document.createTextNode(text));
      if (illegal) {
        const badge = document.createElement('span');
        badge.className = 'cap-illegal-badge';
        badge.textContent = 'ILLEGAL';
        m.appendChild(badge);
      }
      card.appendChild(m);
    }

    function renderResults() {
      const teamA = teamASelect.value;
      const teamB = teamBSelect.value;
      const sendA = valued.players.filter(p => sentA.has(p.id));
      const sendB = valued.players.filter(p => sentB.has(p.id));

      const gridWrap = document.getElementById('resultGrid');
      while (gridWrap.firstChild) gridWrap.removeChild(gridWrap.firstChild);

      const { card: cardA, sentTotal: aOut, recvTotal: aIn } = sideCard(teamA, sendA, sendB);
      const { card: cardB, sentTotal: bOut, recvTotal: bIn } = sideCard(teamB, sendB, sendA);

      // ── Cap legality ──────────────────────────────────────────────────────
      const capA = computeCapSituation(players, teamA, LEAGUE);
      const capB = computeCapSituation(players, teamB, LEAGUE);
      const salOutA = sendA.reduce((s, p) => s + (p.salary || 0), 0);
      const salInA = sendB.reduce((s, p) => s + (p.salary || 0), 0);
      const salOutB = sendB.reduce((s, p) => s + (p.salary || 0), 0);
      const salInB = sendA.reduce((s, p) => s + (p.salary || 0), 0);
      const legalA = isCapLegal(capA.used, salInA - salOutA, LEAGUE);
      const legalB = isCapLegal(capB.used, salInB - salOutB, LEAGUE);
      const newUsedA = capA.used + salInA - salOutA;
      const newUsedB = capB.used + salInB - salOutB;
      metricLine(cardA, 'Cap after trade', '$' + newUsedA + ' / $' + LEAGUE.capPerTeam, !legalA);
      metricLine(cardB, 'Cap after trade', '$' + newUsedB + ' / $' + LEAGUE.capPerTeam, !legalB);

      // ── Lineup impact ────────────────────────────────────────────────────
      const rosterABefore = rosterOf(teamA);
      const rosterAAfter = rosterABefore.filter(p => !sentA.has(p.id)).concat(sendB);
      const rosterBBefore = rosterOf(teamB);
      const rosterBAfter = rosterBBefore.filter(p => !sentB.has(p.id)).concat(sendA);
      const lineupABefore = optimizeLineup(rosterABefore, LEAGUE.rosterSlots);
      const lineupAAfter = optimizeLineup(rosterAAfter, LEAGUE.rosterSlots);
      const lineupBBefore = optimizeLineup(rosterBBefore, LEAGUE.rosterSlots);
      const lineupBAfter = optimizeLineup(rosterBAfter, LEAGUE.rosterSlots);
      const deltaA = lineupAAfter.startersTotal - lineupABefore.startersTotal;
      const deltaB = lineupBAfter.startersTotal - lineupBBefore.startersTotal;
      metricLine(cardA, 'Starting lineup impact', (deltaA >= 0 ? '+' : '') + deltaA.toFixed(1) + ' pts');
      metricLine(cardB, 'Starting lineup impact', (deltaB >= 0 ? '+' : '') + deltaB.toFixed(1) + ' pts');

      gridWrap.appendChild(cardA);
      gridWrap.appendChild(cardB);

      // ── Verdict ──────────────────────────────────────────────────────────
      const verdictEl = document.getElementById('verdict');
      while (verdictEl.firstChild) verdictEl.removeChild(verdictEl.firstChild);
      const v = document.createElement('div');
      if (aOut === 0 && bOut === 0) {
        v.className = 'verdict verdict-none';
        v.textContent = 'Select players from each side to evaluate a trade.';
      } else {
        const gap = aOut - bOut; // positive = Team A giving up more $ value than it gets
        const gapPct = Math.max(aOut, bOut) > 0 ? Math.abs(gap) / Math.max(aOut, bOut) : 0;
        if (gapPct <= 0.15) {
          v.className = 'verdict verdict-fair';
          v.textContent = 'Fair value trade ($' + aOut + ' vs $' + bOut + ').';
        } else {
          v.className = 'verdict verdict-favors';
          v.textContent = (gap > 0 ? teamB : teamA) + ' gets the better value ($' + aOut + ' vs $' + bOut + ').';
        }
      }
      verdictEl.appendChild(v);
    }

    teamASelect.addEventListener('change', () => buildPicker(document.getElementById('rosterA'), teamASelect.value, sentA, sentB));
    teamBSelect.addEventListener('change', () => buildPicker(document.getElementById('rosterB'), teamBSelect.value, sentB, sentA));
    buildPicker(document.getElementById('rosterA'), teamASelect.value, sentA, sentB);
    buildPicker(document.getElementById('rosterB'), teamBSelect.value, sentB, sentA);
  })();
  </script>
</body>
</html>
